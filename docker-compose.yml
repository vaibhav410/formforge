# FormForge — full stack.
#   docker compose up -d --build
# Then open http://localhost:8080 (demo login in README).
# Set GROQ_API_KEY in ai-service/.env (never committed) first.

name: formforge

services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: formforge
      MYSQL_USER: formforge
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  ai:
    build: ./ai-service
    env_file: ./ai-service/.env
    ports:
      - "8001:8001"

  web:
    build: ./web
    ports:
      - "8080:80"
    environment: &laravel-env
      APP_NAME: FormForge
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?run "php artisan key:generate --show" and put APP_KEY in a root .env}
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: formforge
      DB_USERNAME: formforge
      DB_PASSWORD: secret
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: database
      AI_SERVICE_URL: http://ai:8001
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-change-me-shared-secret}
      SEED_DEMO: "true"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai:
        condition: service_started

  # Queue workers under Horizon (pcntl exists in the Linux image).
  horizon:
    build: ./web
    command: ["php", "artisan", "horizon"]
    entrypoint: []
    environment: *laravel-env
    depends_on:
      web:
        condition: service_started
      redis:
        condition: service_healthy

  # Cron surrogate for the nightly analytics rollup.
  scheduler:
    build: ./web
    command: ["php", "artisan", "schedule:work"]
    entrypoint: []
    environment: *laravel-env
    depends_on:
      web:
        condition: service_started

volumes:
  mysql-data:
